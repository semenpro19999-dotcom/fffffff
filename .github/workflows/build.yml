name: build

on:
  push:
    branches: [ "arena/01a0be3e-fffffff" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace --info 2>&1 | tee build.log || true
          echo "GRADLE_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          ls -la build/libs/ 2>/dev/null || echo "no build/libs"

      - name: report to issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FENCE='```'
          SHA7="${GITHUB_SHA:0:7}"
          RUN="${{ github.run_id }}"
          {
            echo "run ${RUN} (${SHA7}) exit=${GRADLE_EXIT:-unknown}"
            echo "--- build/libs ---"
            ls -la build/libs/ 2>/dev/null || echo "(none)"
            echo "--- what went wrong ---"
            sed -n '/What went wrong/,/^\* Try/p' build.log | head -40
            echo "--- compile errors ---"
            grep -n -A2 "error:" build.log | head -90
            echo "--- task failures ---"
            grep -nE "Caused by|Execution failed for task|> Task .* FAILED|Could not (resolve|find|download)" build.log | head -25
            echo "--- tail ---"
            tail -n 10 build.log
          } > report.txt 2>&1
          BODY=$(head -c 50000 report.txt)
          printf '%s\n%s\n%s\n%s\n' "build ${RUN} (${SHA7}) exit=${GRADLE_EXIT:-?}" "${FENCE}" "${BODY}" "${FENCE}" > body.md
          gh api "repos/${{ github.repository }}/issues/1/comments" -f body="$(cat body.md)" > /dev/null
          echo "comment posted"

      - name: capture build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldstudio-jars
          path: build/libs/
          if-no-files-found: ignore
