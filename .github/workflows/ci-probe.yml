name: CI probe

on:
  push:
    branches: [ "arena/01a0be3e-fffffff" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Probe environment
        run: |
          {
            echo "### java"
            java -version 2>&1
            echo "### JAVA_HOME=${JAVA_HOME}"
            echo "### maven central"
            curl -s -o /dev/null -w "%{http_code}\n" https://repo1.maven.org/maven2/
            echo "### fabric maven"
            curl -s -o /dev/null -w "%{http_code}\n" https://maven.fabricmc.net/
            echo "### gradle distributions"
            curl -s -o /dev/null -w "%{http_code}\n" https://services.gradle.org/distributions/
            echo "### minecraft libraries"
            curl -s -o /dev/null -w "%{http_code}\n" https://libraries.minecraft.net/
            echo "### mojang piston meta"
            curl -s -o /dev/null -w "%{http_code}\n" https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
            echo "### modrinth api"
            curl -s -o /dev/null -w "%{http_code}\n" https://api.modrinth.com/maven/
            echo "### done"
          } > probe.txt 2>&1
          cat probe.txt

      - name: Report to issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(head -c 50000 probe.txt)
          FENCE='```'
          SHA7="${GITHUB_SHA:0:7}"
          RUN="${{ github.run_id }}"
          printf '%s\n%s\n%s\n%s\n' "probe run ${RUN} (${SHA7})" "${FENCE}" "${BODY}" "${FENCE}" > body.md
          gh api "repos/${{ github.repository }}/issues/1/comments" -f body="$(cat body.md)" > /dev/null
          echo "comment posted"
