name: CI probe

on:
  push:
    branches: [ "arena/01a0be3e-fffffff" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Probe environment
        run: |
          {
            echo "### java"
            java -version 2>&1
            echo "### JAVA_HOME=$JAVA_HOME"
            echo "### maven central"
            curl -s -o /dev/null -w "%{http_code}\n" https://repo1.maven.org/maven2/
            echo "### fabric maven"
            curl -s -o /dev/null -w "%{http_code}\n" https://maven.fabricmc.net/
            echo "### gradle distributions"
            curl -s -o /dev/null -w "%{http_code}\n" https://services.gradle.org/distributions/
            echo "### minecraft libraries"
            curl -s -o /dev/null -w "%{http_code}\n" https://libraries.minecraft.net/
            echo "### neoforged maven"
            curl -s -o /dev/null -w "%{http_code}\n" https://maven.neoforged.net/releases/
            echo "### modrinth maven"
            curl -s -o /dev/null -w "%{http_code}\n" https://api.modrinth.com/maven/
            echo "### gradle wrapper cached on runner?"
            ls ~/.gradle 2>/dev/null || echo "no ~/.gradle"
            echo "### done"
          } > probe.txt 2>&1
          cat probe.txt

      - name: Report to issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(head -c 55000 probe.txt)
          FENCE='```'
          SHA7="${GITHUB_SHA:0:7}"
          gh api "repos/${{ github.repository }}/issues/1/comments" \
            -f body="probe run ${{ github.run_id }} (${SHA7})

${FENCE}
${BODY}
${FENCE}" > /dev/null && echo "comment posted"
